plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blackops1.recomp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.blackops1.recomp'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.2.0-sdl3'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++23' }
        }
    }

    buildFeatures { prefab true }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}

dependencies {
    implementation files('libs/SDL3-3.2.30.aar')
}
