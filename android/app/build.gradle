
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blackops1.recomp'
    compileSdk 35
    ndkVersion '28.2.13676358'

    buildFeatures {
        prefab true
    }

    // Usar as classes Java do mesmo checkout SDL3 compilado pelo CMake.
    // Evita misturar SDLActivity de um AAR separado com outra libSDL3.so.
    sourceSets {
        main {
            java.srcDir file("${rootProject.projectDir.parentFile}/rexglue-sdk/thirdparty/sdl3/android-project/app/src/main/java")
        }
    }

    defaultConfig {
        applicationId 'com.blackops1.recomp'
        minSdk 29
        targetSdk 35

        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++23'
                // Todas as bibliotecas nativas do SDK, SDL3 e app compartilham
                // o mesmo runtime C++; evita runtimes libc++ duplicados no APK.
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }

    // Defesa adicional contra artefatos antigos: o CMake agora remove o
    // postfix Debug do alvo SDL3 para que o SONAME e o nome esperado por
    // SDLActivity sejam sempre libSDL3.so. O workflow falha se o NEEDED divergir.
    packaging {
        jniLibs {
            excludes += ['**/libSDL3d.so']
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
        }
    }
}

// SDL3 Java agora vem do mesmo checkout do SDL3 nativo; nao adicionar o AAR.
