android {
namespace 'com.blackops1.recomp'
compileSdk 35
ndkVersion '28.2.13676358'


buildFeatures {
    prefab true
}

defaultConfig {
    applicationId 'com.blackops1.recomp'
    minSdk 29
    targetSdk 35

    versionCode 1
    versionName '0.1.0'

    ndk {
        abiFilters 'arm64-v8a'
    }

    externalNativeBuild {
        cmake {
            cppFlags '-std=c++23'
        }
    }
}

externalNativeBuild {
    cmake {
        path 'src/main/cpp/CMakeLists.txt'
        version '3.31.6'
    }
}

buildTypes {
    debug {
        debuggable true
    }

    release {
        minifyEnabled false
    }
}
