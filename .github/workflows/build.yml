name: Baixar e Extrair ReXGlue SDK

on:
  workflow_dispatch:

jobs:
  setup-sdk:
    runs-on: ubuntu-24.04
    
    # Permissão explícita de escrita exigida pelo git-auto-commit-action
    permissions:
      contents: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and Extract ReXGlue SDK
        run: |
          set -e
          echo "Baixando o arquivo ZIP do ReXGlue SDK v0.10.0..."
          curl -L -o rexglue-source.zip https://github.com/rexglue/rexglue-sdk/archive/refs/tags/v0.10.0.zip
          
          echo "Extraindo..."
          unzip -q rexglue-source.zip
          
          # Remove pasta antiga se houver e renomeia a extraída para rexglue-sdk
          rm -rf rexglue-sdk
          mv rexglue-sdk-0.10.0 rexglue-sdk
          
          # Remove o zip temporário
          rm rexglue-source.zip
          echo "SDK extraído e organizado com sucesso!"

      - name: Commit changes back to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-extracted ReXGlue SDK v0.10.0 into rexglue-sdk/"
          branch: main
          file_pattern: "rexglue-sdk/"
