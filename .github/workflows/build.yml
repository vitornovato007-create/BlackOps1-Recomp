name: BlackOps1-Recomp Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Black Ops 1 Recomp
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Verify Black Ops 1 XEX
        run: |
          set -e
          if [ ! -f "game/default.xex" ]; then
            echo "::error::game/default.xex was not found. Certifique-se de que o executável está na pasta game/."
            exit 1
          fi
          echo "Black Ops 1 XEX encontrado com sucesso."

      - name: Ensure ReXGlue SDK is cloned with submodules
        run: |
          set -e
          rm -rf rexglue-sdk
          git clone --recursive --branch v0.10.0 https://github.com/rexglue/rexglue-sdk.git rexglue-sdk

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld cmake ninja-build git python3 pkg-config libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libx11-dev libglu1-mesa-dev libxi-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxss-dev libasound2-dev libpulse-dev libjack-dev \
            libpipewire-0.3-dev libwayland-dev libxkbcommon-dev libibus-1.0-dev libudev-dev libxtst-dev

      - name: Apply C++23 Patches via Script
        run: |
          set -e
          chmod +x tools/patch-sdk.sh
          ./tools/patch-sdk.sh

      - name: Configure CMake
        run: |
          set -e
          export CC=clang
          export CXX=clang++
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_ENABLE_PERF_COUNTERS=OFF \
            -DCMAKE_CXX_FLAGS="-mssse3"

      - name: Diagnose C++23 expected support
        shell: bash
        run: |
          echo "===== VERSAO DO CLANG ====="
          clang++ --version || true

          echo "===== VERSAO DO GCC ====="
          g++ --version || true

          cat > /tmp/test_expected.cpp <<'EOF'
          #include <expected>
          int main() {
            std::expected<int, int> value = 1;
            return value.value() - 1;
          }
          EOF

          echo "===== TESTE COM GCC ====="
          if g++ -std=c++23 -fsyntax-only /tmp/test_expected.cpp; then
            echo "GCC_EXPECTED=OK"
          else
            echo "GCC_EXPECTED=FALHOU"
          fi

          echo "===== TESTE COM CLANG E LIBSTDC++ ====="
          if clang++ -std=c++23 -stdlib=libstdc++ -fsyntax-only /tmp/test_expected.cpp; then
            echo "CLANG_EXPECTED=OK"
          else
            echo "CLANG_EXPECTED=FALHOU"
          fi

          echo "===== FIM DO DIAGNOSTICO ====="

      - name: Build Project
        run: |
          set -e
          cmake --build build --config Release --parallel "$(nproc)"

      - name: Run Codegen / Verify Manifest
        run: |
          set -e

          REXGLUE_BIN="$(find build -type f -name "rexglue" -perm -111 | head -n 1)"

          if [ -n "$REXGLUE_BIN" ]; then
            echo "Executável do ReXGlue encontrado: $REXGLUE_BIN"
            "$REXGLUE_BIN" --help || true
            mkdir -p generated
            "$REXGLUE_BIN" codegen blackops1_manifest.toml \
              --log_level info \
              --log_file blackops1_codegen.log
          else
            echo "Aviso: Binário do rexglue não localizado diretamente, mas a compilação ocorreu."
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlackOps1-Recomp-Artifacts
          path: |
            generated/
            blackops1_codegen.log
          if-no-files-found: ignore
