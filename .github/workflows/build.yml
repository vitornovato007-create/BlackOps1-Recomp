name: Build BlackOps1-Recomp

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackops1-recomp-build
  cancel-in-progress: false

jobs:
  build:
    name: Compilar ReXGlue e BlackOps1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # 1. Baixa os arquivos do projeto.
      - name: Checkout do projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Confere os arquivos necessários.
      - name: Verificar arquivos
        shell: bash
        run: |
          set -euo pipefail

          test -f CMakeLists.txt
          test -f blackops1_manifest.toml
          test -f src/main.cpp

          if [ ! -f game/default.xex ]; then
            echo "::error::game/default.xex não encontrado."
            exit 1
          fi

          echo "===== MANIFESTO ====="
          cat blackops1_manifest.toml

          echo "===== XEX ====="
          ls -lh game/default.xex
          sha256sum game/default.xex

      # 3. Instala dependências.
      - name: Instalar dependências
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            wget ca-certificates git cmake ninja-build \
            build-essential python3 python3-pip python3-venv \
            pkg-config libssl-dev libvulkan-dev libgtk-3-dev \
            libasound2-dev libpulse-dev libjack-dev libsndio-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev \
            libusb-1.0-0-dev libpipewire-0.3-dev libwayland-dev \
            libdecor-0-dev

          wget https://apt.llvm.org/llvm.sh -O /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 20
          sudo apt-get install -y clang-20

      # 4. Confirma a versão do compilador.
      - name: Verificar Clang 20
        shell: bash
        run: |
          set -euo pipefail

          clang-20 --version
          clang++-20 --version
          cmake --version
          ninja --version

      # 5. Baixa o SDK ReXGlue.
      - name: Baixar ReXGlue SDK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rexglue-sdk

          git clone \
            --recursive \
            --branch v0.10.0 \
            https://github.com/rexglue/rexglue-sdk.git \
            rexglue-sdk

          git -C rexglue-sdk fetch --tags --force

          echo "===== VERSÃO DO SDK ====="
          git -C rexglue-sdk describe --tags --always

      # 6. Testa o suporte C++23.
      - name: Testar expected e unexpected
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/test_expected.cpp <<'CPP'
          #include <expected>
          #include <string>

          std::expected<int, std::string> testar(bool ok) {
              if (ok) {
                  return 42;
              }
              return std::unexpected(std::string("erro"));
          }

          int main() {
              auto resultado = testar(true);
              return resultado.value() == 42 ? 0 : 1;
          }
          CPP

          clang++-20 \
            -std=c++23 \
            -stdlib=libstdc++ \
            -fsyntax-only \
            /tmp/test_expected.cpp

          echo "OK: expected e unexpected funcionam."

      # 7. Configura o CMake.
      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          export CC=clang-20
          export CXX=clang++-20

          rm -rf build

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_ENABLE_PERF_COUNTERS=OFF \
            -DCMAKE_CXX_FLAGS="-march=x86-64-v2"

      # 8. Compila o SDK e os alvos padrão.
      - name: Build Project
        shell: bash
        run: |
          set -euo pipefail

          cmake --build build \
            --config Release \
            --parallel 2

      # 9. Confirma que o executável ReXGlue existe.
      - name: Verificar executável ReXGlue
        shell: bash
        run: |
          set -euo pipefail

          REXGLUE_BIN="rexglue-sdk/out/linux-amd64/rexglue"

          if [ ! -x "$REXGLUE_BIN" ]; then
            echo "::error::Executável ReXGlue não encontrado em $REXGLUE_BIN"

            find rexglue-sdk build \
              -type f -name rexglue -print 2>/dev/null || true

            exit 1
          fi

          echo "Executável encontrado: $REXGLUE_BIN"
          "$REXGLUE_BIN" --help

      # 10. Gera o código do Black Ops 1.
      - name: Generate Black Ops 1 Code
        shell: bash
        run: |
          set -euo pipefail

          echo "===== EXECUTANDO BLACKOPS1_CODEGEN ====="

          cmake --build build \
            --target blackops1_codegen \
            --parallel 2

          echo "===== CONTEÚDO DE GENERATED ====="

          if [ ! -d generated ]; then
            echo "::error::A pasta generated não foi criada."
            exit 1
          fi

          find generated -type f \
            -printf '%p (%s bytes)\n'

          if ! find generated -type f \
            ! -name '.gitkeep' \
            -print -quit | grep -q .; then
            echo "::error::O alvo terminou sem gerar arquivos."
            exit 1
          fi

          echo "Geração de código concluída com arquivos encontrados."

      # 11. Inspeciona os resultados, mesmo se uma etapa falhar.
      - name: Inspecionar resultados
        if: always()
        shell: bash
        run: |
          echo "===== ESTADO DO GIT ====="
          git status --short || true

          echo "===== ARQUIVOS GERADOS ====="
          if [ -d generated ]; then
            find generated -type f \
              -printf '%p (%s bytes)\n' || true
          else
            echo "Pasta generated não existe."
          fi

          echo "===== EXECUTÁVEIS ====="
          find build rexglue-sdk \
            -type f -executable \
            -printf '%p (%s bytes)\n' \
            2>/dev/null | sort || true

          echo "===== BIBLIOTECAS E OBJETOS ====="
          find build rexglue-sdk \
            -type f \
            \( -name '*.o' -o -name '*.a' -o -name '*.so' \) \
            -printf '%p (%s bytes)\n' \
            2>/dev/null | head -200 || true

          echo "===== FIM DA INSPEÇÃO ====="

      # 12. Salva os artefatos mesmo se uma etapa falhar.
      - name: Salvar artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackops1-recomp-build
          path: |
            build/
            generated/
            rexglue-sdk/out/linux-amd64/rexglue
          if-no-files-found: warn
          retention-days: 7
