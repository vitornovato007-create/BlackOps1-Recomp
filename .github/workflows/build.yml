name: Build BlackOps1-Recomp

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackops1-recomp-build
  cancel-in-progress: false

jobs:
  build:
    name: Compilar ReXGlue e BlackOps1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # 1. Baixa os arquivos do projeto.
      - name: Checkout do projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Confere os arquivos necessários.
      - name: Verificar arquivos
        shell: bash
        run: |
          set -euo pipefail

          test -f blackops1_manifest.toml
          test -f src/main.cpp

          if [ ! -f game/default.xex ]; then
            echo "::error::game/default.xex não encontrado."
            echo "Adicione o executável autorizado ao local esperado."
            exit 1
          fi

          echo "Arquivos básicos encontrados."

      # 3. Instala Clang 20 e dependências do SDL3.
      - name: Instalar dependências
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            ca-certificates \
            git \
            cmake \
            ninja-build \
            build-essential \
            python3 \
            python3-pip \
            python3-venv \
            pkg-config \
            libssl-dev \
            libvulkan-dev \
            libgtk-3-dev \
            libasound2-dev \
            libpulse-dev \
            libjack-dev \
            libsndio-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libthai-dev \
            libusb-1.0-0-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libdecor-0-dev

          wget https://apt.llvm.org/llvm.sh \
            -O /tmp/llvm.sh

          chmod +x /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 20

          sudo apt-get install -y clang-20

      # 4. Confirma a versão do compilador.
      - name: Verificar Clang 20
        shell: bash
        run: |
          set -euo pipefail

          clang-20 --version
          clang++-20 --version

      # 5. Baixa o SDK ReXGlue.
      - name: Baixar ReXGlue SDK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rexglue-sdk

          git clone \
            --recursive \
            --branch v0.10.0 \
            https://github.com/rexglue/rexglue-sdk.git \
            rexglue-sdk

          git -C rexglue-sdk fetch --tags --force

          echo "===== VERSÃO DO SDK ====="
          git -C rexglue-sdk describe --tags --always

      # 6. Testa o suporte C++23.
      - name: Testar expected e unexpected
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/test_expected.cpp <<'EOF'
          #include <expected>
          #include <string>

          std::expected<int, std::string> testar(bool ok) {
              if (ok) {
                  return 42;
              }

              return std::unexpected(std::string("erro"));
          }

          int main() {
              auto resultado = testar(true);
              return resultado.value() == 42 ? 0 : 1;
          }
          EOF

          clang++-20 \
            -std=c++23 \
            -stdlib=libstdc++ \
            -fsyntax-only \
            /tmp/test_expected.cpp

          echo "OK: expected e unexpected funcionam."

      # 7. Configura o CMake.
      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          export CC=clang-20
          export CXX=clang++-20

          rm -rf build

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_ENABLE_PERF_COUNTERS=OFF \
            -DCMAKE_CXX_FLAGS="-march=x86-64-v2"

      # 8. Compila o projeto.
      - name: Build Project
        shell: bash
        run: |
          set -euo pipefail

          cmake --build build \
            --config Release \
            --parallel 2

      # 9. Inspeciona os resultados.
      - name: Inspecionar resultados
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "===== EXECUTÁVEIS ====="

          find build rexglue-sdk \
            -type f -executable \
            -printf '%p\n' 2>/dev/null | sort || true

          echo "===== ARQUIVOS GERADOS ====="

          find generated \
            -maxdepth 4 -type f \
            -print 2>/dev/null || true

      # 10. Salva os artefatos.
      - name: Salvar artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackops1-recomp-build
          path: |
            build/
            generated/
          if-no-files-found: warn
          retention-days: 7
