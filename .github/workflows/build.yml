name: Build BlackOps1-Recomp

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackops1-recomp-build
  cancel-in-progress: false

jobs:
  build:
    name: Compilar ReXGlue e BlackOps1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # 1. Baixa os arquivos do repositório.
      - name: Checkout do projeto
        uses: actions/checkout@v4

      # 2. Verifica os arquivos necessários.
      - name: Verificar arquivos do projeto
        shell: bash
        run: |
          set -euo pipefail

          test -f blackops1_manifest.toml
          test -f tools/patch-sdk.sh
          test -f src/main.cpp

          if [ ! -f game/default.xex ]; then
            echo "::error::game/default.xex não encontrado."
            echo "Adicione o executável autorizado ao local esperado."
            exit 1
          fi

          echo "Arquivos básicos encontrados."

      # 3. Instala as dependências.
      - name: Instalar dependências
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            cmake \
            ninja-build \
            git \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            libssl-dev \
            libvulkan-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      # 4. Baixa o SDK sem falhar se a pasta já existir.
      - name: Baixar ReXGlue SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "rexglue-sdk/.git" ]; then
            echo "Repositório ReXGlue já existe."

            git -C rexglue-sdk fetch --tags --force
            git -C rexglue-sdk checkout --force v0.10.0
            git -C rexglue-sdk submodule update --init --recursive

          else
            echo "Preparando uma pasta limpa para o SDK."

            rm -rf rexglue-sdk

            git clone \
              --recursive \
              --branch v0.10.0 \
              https://github.com/rexglue/rexglue-sdk.git \
              rexglue-sdk
          fi

          echo "===== VERSÃO DO RE XGLUE ====="
          git -C rexglue-sdk describe --tags --always

      # 5. Aplica as correções de compatibilidade.
      - name: Aplicar patches no SDK
        shell: bash
        run: |
          set -euo pipefail
          bash tools/patch-sdk.sh

      # 6. Verifica o suporte a C++23.
      - name: Testar suporte C++23
        shell: bash
        run: |
          set -euo pipefail

          g++ --version

          cat > /tmp/test_expected.cpp <<'EOF'
          #include <expected>
          #include <string>

          std::expected<int, std::string> testar(bool ok) {
            if (ok) {
              return 42;
            }

            return std::unexpected(std::string("erro"));
          }

          int main() {
            auto resultado = testar(true);
            return resultado.value() == 42 ? 0 : 1;
          }
          EOF

          g++ -std=c++23 -fsyntax-only /tmp/test_expected.cpp

          echo "std::expected e std::unexpected reconhecidos."

      # 7. Configura o CMake usando GCC.
      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          export CC=gcc
          export CXX=g++

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_ENABLE_PERF_COUNTERS=OFF \
            -DCMAKE_CXX_FLAGS="-mssse3 -ffp-contract=off"

      # 8. Compila o projeto.
      - name: Build Project
        shell: bash
        run: |
          set -euo pipefail

          cmake --build build \
            --config Release \
            --parallel "$(nproc)"

      # 9. Procura executáveis e arquivos gerados.
      - name: Localizar ferramentas geradas
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "===== EXECUTÁVEIS DO SDK ====="

          find build rexglue-sdk \
            -type f -executable \
            -printf '%p\n' 2>/dev/null | sort || true

          echo "===== ARQUIVOS GERADOS ====="

          find generated \
            -maxdepth 3 -type f \
            -print 2>/dev/null || true

      # 10. Salva os artefatos para análise.
      - name: Upload dos artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackops1-recomp-build
          path: |
            build/
            generated/
          if-no-files-found: warn
          retention-days: 7
