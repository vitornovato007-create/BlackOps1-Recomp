name: BlackOps1-Recomp v0.1

on:
  workflow_dispatch:

jobs:
  codegen:
    name: ReXGlue 0.10.0 - Black Ops 1 Codegen
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check Black Ops 1 XEX
        shell: bash
        run: |
          set -e
          if [ ! -f "game/default.xex" ]; then
            echo "::error::game/default.xex was not found."
            echo "Place your legally obtained default.xex at game/default.xex"
            exit 1
          fi
          echo "Black Ops 1 XEX found."
          ls -lh game/default.xex
          file game/default.xex

      - name: Install build dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld cmake ninja-build git python3 python3-pip pkg-config libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libx11-dev libglu1-mesa-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxss-dev libasound2-dev libpulse-dev libjack-dev libpipewire-0.3-dev libwayland-dev libxkbcommon-dev libibus-1.0-dev libudev-dev libxtst-dev
          echo "Compiler:"
          clang++ --version
          echo "CMake:"
          cmake --version

      - name: Clone ReXGlue 0.10.0
        shell: bash
        run: |
          set -e
          git clone --depth 1 --branch v0.10.0 https://github.com/rexglue/rexglue-sdk.git rexglue-sdk
          cd rexglue-sdk
          git submodule update --init --recursive
          echo "ReXGlue commit:"
          git rev-parse HEAD
          echo "ReXGlue tag:"
          git describe --tags --always

      - name: Configure ReXGlue
        working-directory: rexglue-sdk
        shell: bash
        run: |
          set -e
          cmake --preset linux-amd64 -DCMAKE_CXX_STANDARD=23 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DREXGLUE_ENABLE_TRACY=OFF -DREXGLUE_ENABLE_PERF_COUNTERS=OFF

      - name: Build ReXGlue
        working-directory: rexglue-sdk
        shell: bash
        run: |
          set -e
          cmake --build --preset linux-amd64-release --target rexglue --parallel 2

      - name: Locate ReXGlue executable
        shell: bash
        run: |
          set -e
          echo "Searching for rexglue executable..."
          find rexglue-sdk -type f -name "rexglue" -perm -111 -print
          REXGLUE_BIN="$(find rexglue-sdk -type f -name "rexglue" -perm -111 | head -n 1)"
          if [ -z "$REXGLUE_BIN" ]; then
            echo "::error::ReXGlue executable was not found."
            exit 1
          fi
          echo "REXGLUE_BIN=$REXGLUE_BIN" >> "$GITHUB_ENV"
          echo "Using:"
          echo "$REXGLUE_BIN"

      - name: Test ReXGlue
        shell: bash
        run: |
          set -e
          echo "Testing ReXGlue..."
          "$REXGLUE_BIN" --help

      - name: Prepare generated directory
        shell: bash
        run: |
          set -e
          mkdir -p generated
          ls -la generated

      - name: ReXGlue Codegen
        shell: bash
        run: |
          set -o pipefail
          echo "=============================================="
          echo " BlackOps1-Recomp v0.1"
          echo " ReXGlue 0.10.0 Code Generation"
          echo "=============================================="
          echo ""
          echo "Project:"
          cat blackops1_manifest.toml
          echo ""
          echo "XEX information:"
          file game/default.xex
          ls -lh game/default.xex
          echo ""
          echo "Starting ReXGlue..."
          "$REXGLUE_BIN" codegen blackops1_manifest.toml --log_level info --log_file blackops1_codegen.log

      - name: Show generated files
        if: always()
        shell: bash
        run: |
          echo "=============================================="
          echo " Generated files"
          echo "=============================================="
          if [ -d "generated" ]; then
            find generated -maxdepth 2 -type f -printf '%p\t%k KB\n' | sort
          else
            echo "generated/ does not exist."
          fi

      - name: Show codegen log
        if: always()
        shell: bash
        run: |
          echo "=============================================="
          echo " ReXGlue codegen log"
          echo "=============================================="
          if [ -f "blackops1_codegen.log" ]; then
            cat blackops1_codegen.log
          else
            echo "No codegen log was produced."
          fi

      - name: Upload codegen results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlackOps1-Recomp-v0.1-codegen
          path: |
            generated/
            blackops1_codegen.log
          if-no-files-found: warn
