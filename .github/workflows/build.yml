name: Build BlackOps1-Recomp

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackops1-recomp-build
  cancel-in-progress: false

jobs:
  build:
    name: Compilar ReXGlue e BlackOps1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      # 1. Verifica os arquivos do projeto.
      - name: Verificar arquivos
        shell: bash
        run: |
          set -euo pipefail

          test -f blackops1_manifest.toml
          test -f src/main.cpp

          if [ ! -f game/default.xex ]; then
            echo "::error::game/default.xex não encontrado."
            echo "Adicione um executável de jogo obtido legalmente."
            exit 1
          fi

          echo "Arquivos básicos encontrados."

      # 2. Instala o Clang 20 e as dependências.
      - name: Instalar Clang 20 e dependências
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            ca-certificates \
            git \
            cmake \
            ninja-build \
            build-essential \
            python3 \
            python3-pip \
            python3-venv \
            pkg-config \
            libssl-dev \
            libvulkan-dev \
            libgtk-3-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

          wget https://apt.llvm.org/llvm.sh \
            -O /tmp/llvm.sh

          chmod +x /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 20

          sudo apt-get install -y clang-20

      # 3. Confirma a versão do compilador.
      - name: Verificar versão do Clang
        shell: bash
        run: |
          set -euo pipefail

          clang-20 --version
          clang++-20 --version

          VERSION="$(clang++-20 -dumpversion)"
          MAJOR="${VERSION%%.*}"

          if [ "$MAJOR" -lt 20 ]; then
            echo "::error::Clang 20 ou superior é necessário."
            exit 1
          fi

      # 4. Baixa o SDK na versão escolhida.
      - name: Baixar ReXGlue SDK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rexglue-sdk

          git clone \
            --recursive \
            --branch v0.10.0 \
            https://github.com/rexglue/rexglue-sdk.git \
            rexglue-sdk

          echo "===== VERSÃO DO SDK ====="
          git -C rexglue-sdk describe --tags --always

      # 5. Testa o suporte a C++23 antes da compilação.
      - name: Testar expected e unexpected
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/test_expected.cpp <<'EOF'
          #include <expected>
          #include <string>

          std::expected<int, std::string> testar(bool ok) {
              if (ok) {
                  return 42;
              }

              return std::unexpected(std::string("erro"));
          }

          int main() {
              auto resultado = testar(true);
              return resultado.value() == 42 ? 0 : 1;
          }
          EOF

          clang++-20 \
            -std=c++23 \
            -stdlib=libstdc++ \
            -fsyntax-only \
            /tmp/test_expected.cpp

          echo "OK: expected e unexpected funcionam."

      # 6. Configura o CMake com Clang 20.
      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          export CC=clang-20
          export CXX=clang++-20

          rm -rf build

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_ENABLE_PERF_COUNTERS=OFF \
            -DCMAKE_CXX_FLAGS="-march=x86-64-v2"

      # 7. Compila os alvos configurados.
      - name: Build Project
        shell: bash
        run: |
          set -euo pipefail

          cmake --build build \
            --config Release \
            --parallel 2

      # 8. Mostra os arquivos produzidos.
      - name: Inspecionar resultados
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "===== EXECUTÁVEIS ====="

          find build rexglue-sdk \
            -type f -executable \
            -printf '%p\n' 2>/dev/null | sort || true

          echo "===== ARQUIVOS GERADOS ====="

          find generated \
            -maxdepth 4 -type f \
            -print 2>/dev/null || true

      # 9. Guarda os resultados para diagnóstico.
      - name: Salvar artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackops1-recomp-build
          path: |
            build/
            generated/
          if-no-files-found: warn
          retention-days: 7
