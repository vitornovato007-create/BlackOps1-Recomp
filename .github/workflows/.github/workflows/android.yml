name: Android ARM64 Build

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "tools/android/**"
      - "src/**"
      - "generated/**"
      - "CMakeLists.txt"
      - "blackops1_manifest.toml"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  prepare-android:
    name: Prepare Android Build Environment
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar Android SDK e NDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      - name: Verificar ferramentas
        run: |
          echo "Java:"
          java -version

          echo "Python:"
          python --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Android NDK:"
          ls "$ANDROID_HOME/ndk"

          echo "CMake:"
          cmake --version

      - name: Verificar estrutura Android
        run: |
          if [ -d android ]; then
            echo "Pasta android encontrada."
          else
            echo "Pasta android ainda nao existe."
            echo "A etapa atual apenas prepara o ambiente."
          fi

      - name: Salvar diagnostico
        if: always()
        run: |
          mkdir -p android-diagnostic
          {
            echo "Diagnostico do ambiente Android"
            date -u
            java -version 2>&1
            python --version
            cmake --version
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME/ndk" 2>&1 || true
          } > android-diagnostic/environment.txt

      - name: Publicar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-environment
          path: android-diagnostic/
          if-no-files-found: warn
          retention-days: 7
