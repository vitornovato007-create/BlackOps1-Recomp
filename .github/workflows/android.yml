name: Android ARM64 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-android:
    name: Prepare Android Build Environment
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      - name: Verificar ferramentas instaladas
        shell: bash
        run: |
          set -euo pipefail
          echo "Java:"
          java -version
          echo "Python:"
          python --version
          echo "Android SDK:"
          echo "$ANDROID_HOME"
          echo "Pacotes Android instalados:"
          sdkmanager --list_installed
          echo "NDK:"
          ls "$ANDROID_HOME/ndk"
          echo "CMake:"
          cmake --version

      - name: Verificar estrutura Android
        shell: bash
        run: |
          set -euo pipefail
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/gradle.properties
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/cpp/CMakeLists.txt
          test -f android/app/src/main/cpp/native-lib.cpp
          echo "Estrutura Android basica encontrada."

      - name: Salvar diagnostico
        if: always()
        shell: bash
        run: |
          mkdir -p android-diagnostic
          {
            echo "Diagnostico do ambiente Android"
            date -u
            java -version 2>&1
            python --version 2>&1
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME/ndk" 2>&1 || true
            cmake --version 2>&1 || true
          } > android-diagnostic/environment.txt

      - name: Publicar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-environment
          path: android-diagnostic/
          if-no-files-found: warn
          retention-days: 7
