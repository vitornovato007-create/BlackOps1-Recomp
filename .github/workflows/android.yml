name: Android ARM64 Build

on:
  workflow_dispatch:
  push:
    branches:
      - fix/diagnostico-e-integracao-android

permissions:
  contents: read

jobs:
  prepare-android:
    name: Inspect and Build Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Diagnostico estatico unificado
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p android-diagnostic
          python3 tools/diagnostico_completo.py 2>&1 | tee android-diagnostic/diagnostico-completo.txt
          diagnostic_status=${PIPESTATUS[0]}
          if [ "$diagnostic_status" -ne 0 ]; then
            echo "::error::O diagnostico estatico encontrou bloqueadores."
            exit "$diagnostic_status"
          fi
          python3 scripts/auditar_gerados.py 2>&1 | tee android-diagnostic/auditoria-gerados.txt
          audit_status=${PIPESTATUS[0]}
          if [ "$audit_status" -ne 0 ]; then
            echo "::error::A auditoria de arquivos gerados falhou."
            exit "$audit_status"
          fi

      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          set -uo pipefail

          required_files=(
            "android/settings.gradle"
            "android/build.gradle"
            "android/gradle.properties"
            "android/app/build.gradle"
            "android/app/src/main/AndroidManifest.xml"
            "android/app/src/main/cpp/CMakeLists.txt"
            "android/app/src/main/cpp/native-lib.cpp"
            "android/app/src/main/cpp/android_main.cpp"
            "android/app/src/main/cpp/native-xiso-bridge.cpp"
            "android/app/src/main/cpp/xiso-integration.cmake"
            "thirdparty/extract-xiso/extract-xiso.c"
          )

          missing=0

          echo "=========================================="
          echo "VERIFICACAO DA ESTRUTURA DO PROJETO"
          echo "=========================================="

          for path in "${required_files[@]}"; do
            if [ -f "$path" ]; then
              echo "[OK] $path"
            else
              echo "::error file=$path::Arquivo obrigatorio nao encontrado: $path"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Arquivos encontrados nas pastas relevantes:"
            find android/app/src/main/cpp thirdparty \
              -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "Estrutura inicial encontrada."

      - name: Preparar ReXGlue e submodulos
        shell: bash
        run: |
          set -euo pipefail

          REXGLUE_URL="https://github.com/rexglue/rexglue-sdk.git"

          if [ -f "rexglue-sdk/CMakeLists.txt" ] &&
             [ -f "rexglue-sdk/thirdparty/CMakeLists.txt" ] &&
             [ -f "rexglue-sdk/thirdparty/cli11/CMakeLists.txt" ] &&
             [ -f "rexglue-sdk/thirdparty/sdl3/CMakeLists.txt" ]; then
            echo "ReXGlue e componentes principais encontrados."
          else
            echo "Checkout existente incompleto."
            echo "Tentando obter ReXGlue com submodulos..."
            rm -rf rexglue-sdk
            git clone --branch v0.10.0 --depth 1 --recursive "$REXGLUE_URL" rexglue-sdk
          fi

          test -f "rexglue-sdk/CMakeLists.txt"
          test -f "rexglue-sdk/thirdparty/CMakeLists.txt"
          test -f "rexglue-sdk/thirdparty/cli11/CMakeLists.txt"
          test -f "rexglue-sdk/thirdparty/sdl3/CMakeLists.txt"

          echo "ReXGlue preparado."
          git -C rexglue-sdk log -1 --oneline
          git -C rexglue-sdk submodule status --recursive

      - name: Aplicar suporte Android do SDK ReXGlue
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/android/apply_android_sdk_patch.py
          test -f rexglue-sdk/include/rex/main_android.h
          test -f rexglue-sdk/src/core/android_runtime.cpp
          grep -q 'android_runtime.cpp' rexglue-sdk/src/core/CMakeLists.txt
          grep -q 'SetAndroidApplicationContext' rexglue-sdk/include/rex/main_android.h
          echo "OK: API de contexto JNI e runtime Android do ReXGlue preparados."

      - name: Corrigir e verificar diretorio de logs Android no ReXGlue
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/android/apply_logging_patch.py
          grep -n -A16 -B2 'ANDROID_SAFE_LOG_DIR_PATCH' rexglue-sdk/src/ui/rex_app.cpp
          if grep -Fq 'log_config.log_dir = (exe_dir / "logs").string();' rexglue-sdk/src/ui/rex_app.cpp; then
            echo "::error::O caminho antigo /system/bin/logs continua no ReXGlue."
            exit 1
          fi

      - name: Aplicar backend de fibers Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/android/apply_fiber_backend.py

      - name: Aplicar backend de janela e surface Android
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/android/apply_ui_backend.py

      - name: Aplicar e verificar timer_queue.cpp compativel com Android
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="patches/android/timer_queue.cpp"
          TARGET="rexglue-sdk/src/core/timer_queue.cpp"

          if [ ! -f "$SOURCE" ]; then
            echo "::error file=$SOURCE::Patch persistente do TimerQueue nao encontrado."
            exit 1
          fi
          if [ ! -f "$TARGET" ]; then
            echo "::error file=$TARGET::TimerQueue do checkout ReXGlue nao encontrado."
            exit 1
          fi

          cp "$SOURCE" "$TARGET"

          if grep -n -E 'std::jthread|std::stop_token|request_stop\\(' "$TARGET"; then
            echo "::error file=$TARGET::O TimerQueue ainda contem APIs jthread/stop_token incompatíveis com o compilador Android usado."
            exit 1
          fi

          grep -q 'std::thread dispatch_thread_' "$TARGET"
          grep -q 'std::atomic<bool> stop_requested_' "$TARGET"
          grep -q 'dispatch_thread_.join()' "$TARGET"

          echo "Patch aplicado e verificado no SDK que sera compilado:"
          grep -n -E 'std::thread dispatch_thread_|std::atomic<bool> stop_requested_|dispatch_thread_.join' "$TARGET"

      - name: Aplicar compatibilidade C++ do ReXGlue para Android NDK
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          numeric = Path("rexglue-sdk/include/rex/string/numeric.h")
          chrono = Path("rexglue-sdk/include/rex/chrono/chrono.h")

          for path in (numeric, chrono):
              if not path.is_file():
                  raise SystemExit(f"::error file={path}::Cabecalho ReXGlue ausente.")
          
          # The upstream SDK is freshly cloned on every workflow run, so apply
          # these compatibility changes here instead of relying on repo edits.
          # O patch Android fixado do ReXGlue ja altera estes guards para
          # REX_PLATFORM_ANDROID. Este passo tambem aceita o SDK original,
          # tornando a verificacao idempotente em ambos os formatos.
          text = numeric.read_text(encoding="utf-8")
          text, _ = re.subn(
              r"(?m)^#if REX_PLATFORM_MAC\s*$",
              "#if REX_PLATFORM_MAC || REX_PLATFORM_ANDROID",
              text,
          )
          already_patched_count = text.count(
              "#if REX_PLATFORM_MAC || REX_PLATFORM_ANDROID"
          )
          guard_count = already_patched_count
          if guard_count < 3:
              raise SystemExit(
                  "ERRO: numeric.h nao contem os guards esperados para "
                  "REX_PLATFORM_ANDROID/float from_chars."
              )
          numeric.write_text(text, encoding="utf-8")

          text = chrono.read_text(encoding="utf-8")
          old_guard = "#ifdef __APPLE__"
          new_guard = "#if defined(__APPLE__) || (defined(_LIBCPP_VERSION) && _LIBCPP_VERSION < 200000)"
          if old_guard in text:
              text = text.replace(old_guard, new_guard, 1)
              chrono.write_text(text, encoding="utf-8")
          elif new_guard not in text:
              raise SystemExit(
                  "ERRO: chrono.h nao contem o fallback libc++ esperado "
                  "para Android NDK."
              )

          # Confirme os simbolos realmente usados pelo patch Android fixado.
          numeric_text = numeric.read_text(encoding="utf-8")
          chrono_text = chrono.read_text(encoding="utf-8")
          if "portable_float_from_chars" not in numeric_text:
              raise SystemExit("ERRO: fallback de float nao encontrado em numeric.h.")
          if "REX_PLATFORM_ANDROID" not in numeric_text:
              raise SystemExit("ERRO: guard REX_PLATFORM_ANDROID ausente em numeric.h.")
          if "_LIBCPP_VERSION < 200000" not in chrono_text:
              raise SystemExit("ERRO: fallback libc++/chrono nao foi habilitado para Android.")
          if "clock_time_conversion" not in chrono_text:
              raise SystemExit("ERRO: declaracao clock_time_conversion ausente em chrono.h.")

          print("Compatibilidade Android aplicada e verificada:")
          print(f"  {numeric}: {guard_count} guards Android reconhecidos")
          print(f"  {chrono}: fallback libc++/chrono confirmado")
          PYTHON

          echo "Confirmando alteracoes aplicadas:"
          grep -n -E 'portable_float_from_chars|REX_PLATFORM_MAC.*REX_PLATFORM_ANDROID' \
            rexglue-sdk/include/rex/string/numeric.h
          grep -n -E '_LIBCPP_VERSION|clock_time_conversion' \
            rexglue-sdk/include/rex/chrono/chrono.h | head -20

      - name: Corrigir dependencias Linux no ReXGlue para Android
        shell: bash
        run: |
          set -euo pipefail

          FILE="rexglue-sdk/src/ui/CMakeLists.txt"

          if [ ! -f "$FILE" ]; then
            echo "::error file=$FILE::CMakeLists.txt do rexui nao encontrado."
            exit 1
          fi

          python - "$FILE" <<'PYTHON'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"(?m)^# Platform-specific dependencies[^\n]*\n"
              r".*?"
              r"(?=^if\(WIN32\)\s*$)",
              re.DOTALL,
          )

          replacement = """# Platform-specific dependencies.
          # Android must not require Linux desktop X11/Wayland packages.
          if(ANDROID)
              # SDL3 provides Android platform integration.
              target_link_libraries(rexui PUBLIC android)
          elseif(UNIX AND NOT APPLE)
              find_package(PkgConfig REQUIRED)

              pkg_check_modules(X11_XCB REQUIRED x11-xcb)
              pkg_check_modules(WAYLAND REQUIRED wayland-client)

              target_include_directories(rexui PUBLIC
                  ${X11_XCB_INCLUDE_DIRS}
                  ${WAYLAND_INCLUDE_DIRS}
              )

              target_link_libraries(rexui PUBLIC
                  ${X11_XCB_LIBRARIES}
                  ${WAYLAND_LIBRARIES}
              )
          elseif(APPLE)
              target_link_libraries(rexui PRIVATE "-framework CoreFoundation")
          endif()

          """

          updated, count = pattern.subn(
              lambda _: replacement,
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "ERRO: nao foi possivel localizar a secao de "
                  "dependencias de plataforma esperada em "
                  "rexglue-sdk/src/ui/CMakeLists.txt. "
                  "O arquivo nao foi alterado."
              )

          path.write_text(updated, encoding="utf-8")

          result = path.read_text(encoding="utf-8")

          if "if(ANDROID)" not in result:
              raise SystemExit(
                  "ERRO: o bloco de dependencias Android nao foi aplicado."
              )

          print("Correcao Android aplicada ao ReXGlue.")
          print("Verificando bloco de dependencias:")
          print(
              result[
                  result.find("# Platform-specific dependencies"):
                  result.find("if(WIN32)", result.find(
                      "# Platform-specific dependencies"
                  ))
              ]
          )
          PYTHON

      - name: Remover bibliotecas POSIX indisponiveis no Android
        shell: bash
        run: |
          set -euo pipefail

          FILE="rexglue-sdk/src/core/CMakeLists.txt"
          if [ ! -f "$FILE" ]; then
            echo "::error file=$FILE::CMakeLists.txt do rexcore nao encontrado."
            exit 1
          fi

          python - "$FILE" <<'PYTHON'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")
          old = """if(APPLE)
              target_link_libraries(rexcore PRIVATE pthread)
          elseif(UNIX)
              target_link_libraries(rexcore PRIVATE pthread rt dl)
          endif()"""
          new = """if(APPLE)
              target_link_libraries(rexcore PRIVATE pthread)
          elseif(ANDROID)
              # Bionic provides pthread and realtime APIs without separate
              # -lpthread/-lrt libraries; keep libdl for dlopen/dlsym.
              target_link_libraries(rexcore PRIVATE dl)
          elseif(UNIX)
              target_link_libraries(rexcore PRIVATE pthread rt dl)
          endif()"""
          if new not in content:
              if old not in content:
                  raise SystemExit("ERRO: bloco de link POSIX do rexcore nao corresponde ao esperado.")
              content = content.replace(old, new, 1)
              path.write_text(content, encoding="utf-8")
          if "elseif(ANDROID)" not in content or "target_link_libraries(rexcore PRIVATE dl)" not in content:
              raise SystemExit("ERRO: dependencias Android do rexcore nao foram configuradas.")
          print("Dependencias de link Android do rexcore corrigidas.")
          PYTHON

          grep -n -A10 -B2 'target_link_libraries(rexcore PRIVATE' "$FILE"

      - name: Corrigir deteccao de plataforma ReXGlue para Android
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          path = Path("rexglue-sdk/CMakeLists.txt")
          content = path.read_text(encoding="utf-8")
          marker = "# Platform detection (supports AMD64 and ARM64)"
          start = content.find(marker)
          if start < 0:
              raise SystemExit("ERRO: bloco de deteccao de plataforma nao encontrado.")
          end = content.find("# Build config as compile definition", start)
          if end < 0:
              raise SystemExit("ERRO: fim do bloco de plataforma nao encontrado.")
          block = content[start:end]

          if "elseif(ANDROID)" in block:
              print("Deteccao Android ja existe; nenhuma alteracao necessaria.")
          else:
              old = "elseif(UNIX AND NOT APPLE)"
              if old not in block:
                  raise SystemExit("ERRO: ramo Unix esperado nao encontrado no bloco de plataforma.")
              block = block.replace(
                  old,
                  """elseif(ANDROID)
              if(REX_TARGET_PROCESSOR MATCHES "aarch64|ARM64|arm64")
                  set(REX_PLATFORM "android-arm64")
              else()
                  message(FATAL_ERROR "ReXGlue Android requer ARM64; arquitetura: ${REX_TARGET_PROCESSOR}")
              endif()
              add_compile_definitions(REX_PLATFORM_ANDROID=1)
          elseif(UNIX AND NOT APPLE)""",
                  1,
              )
              content = content[:start] + block + content[end:]
              path.write_text(content, encoding="utf-8")

          verify = path.read_text(encoding="utf-8")
          start = verify.find(marker)
          end = verify.find("# Build config as compile definition", start)
          block = verify[start:end]
          if "elseif(ANDROID)" not in block or 'set(REX_PLATFORM "android-arm64")' not in block:
              raise SystemExit("ERRO: selecao de plataforma Android nao foi aplicada.")
          if "add_compile_definitions(REX_PLATFORM_ANDROID=1)" not in block:
              raise SystemExit("ERRO: macro REX_PLATFORM_ANDROID nao foi adicionada.")
          print("Selecao de plataforma Android ARM64 aplicada e verificada.")
          print(block)
          PYTHON

      - name: Corrigir APIs Android ausentes no ReXGlue POSIX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          root = Path("rexglue-sdk")
          memory = root / "src/core/memory_posix.cpp"
          threading = root / "src/core/threading_posix.cpp"
          header = root / "include/rex/main_android.h"

          for path in (memory, threading):
              if not path.is_file():
                  raise SystemExit(f"::error file={path}::Arquivo ReXGlue necessario ausente.")

          # Android's NDK exposes the device API level directly.
          text = memory.read_text(encoding="utf-8")
          if "#include <android/api-level.h>" not in text:
              text, count = re.subn(
                  r"(?m)^#if REX_PLATFORM_ANDROID\s*$",
                  "#if REX_PLATFORM_ANDROID\n#include <android/api-level.h>",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("ERRO: bloco Android nao encontrado em memory_posix.cpp.")
          text = text.replace("rex::GetAndroidApiLevel()", "android_get_device_api_level()")
          if "android_get_device_api_level()" not in text or "#include <android/api-level.h>" not in text:
              raise SystemExit("ERRO: API level Android nao foi corrigida em memory_posix.cpp.")
          memory.write_text(text, encoding="utf-8")

          text = threading.read_text(encoding="utf-8")
          old_assert = 'static_assert(REX_PLATFORM_LINUX || REX_PLATFORM_MAC, "This file is POSIX-only");'
          new_assert = 'static_assert(REX_PLATFORM_LINUX || REX_PLATFORM_MAC || REX_PLATFORM_ANDROID, "This file is POSIX-only");'
          if old_assert in text:
              text = text.replace(old_assert, new_assert, 1)
          elif new_assert not in text:
              raise SystemExit("ERRO: static_assert esperado nao encontrado em threading_posix.cpp.")
          if "#include <rex/main_android.h>" not in text:
              raise SystemExit("ERRO: include esperado rex/main_android.h nao encontrado em threading_posix.cpp.")

          # Bionic does not implement robust pthread mutexes. Keep the ordinary
          # std::mutex path on Android; robust recovery remains enabled on Linux.
          robust_guard = "#if REX_PLATFORM_LINUX\n"
          replacements = [
              (robust_guard + "    // Use robust mutexes so waits can recover if owner thread terminates.",
               "#if REX_PLATFORM_LINUX && !defined(__ANDROID__)\n    // Use robust mutexes so waits can recover if owner thread terminates."),
              (robust_guard + "    auto native_mutex = static_cast<pthread_mutex_t*>(mutex_.native_handle());",
               "#if REX_PLATFORM_LINUX && !defined(__ANDROID__)\n    auto native_mutex = static_cast<pthread_mutex_t*>(mutex_.native_handle());"),
              (robust_guard + "        auto native_mutex = static_cast<pthread_mutex_t*>(handles[i]->mutex_.native_handle());",
               "#if REX_PLATFORM_LINUX && !defined(__ANDROID__)\n        auto native_mutex = static_cast<pthread_mutex_t*>(handles[i]->mutex_.native_handle());"),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit("ERRO: bloco de mutex robusto esperado nao encontrado em threading_posix.cpp.")
          if "PTHREAD_MUTEX_ROBUST" not in text:
              raise SystemExit("ERRO: patch inesperadamente removeu o codigo robusto Linux.")
          if text.count("#if REX_PLATFORM_LINUX && !defined(__ANDROID__)") < 3:
              raise SystemExit("ERRO: os tres caminhos de mutex robusto nao foram protegidos para Android.")
          threading.write_text(text, encoding="utf-8")

          header.parent.mkdir(parents=True, exist_ok=True)
          header.write_text(
              "#pragma once\n"
              "#if REX_PLATFORM_ANDROID\n"
              "#include <android/api-level.h>\n"
              "namespace rex {\n"
              "inline int GetAndroidApiLevel() { return android_get_device_api_level(); }\n"
              "}  // namespace rex\n"
              "#endif  // REX_PLATFORM_ANDROID\n",
              encoding="utf-8",
          )

          if new_assert not in threading.read_text(encoding="utf-8"):
              raise SystemExit("ERRO: threading_posix.cpp nao habilitou a compilacao Android.")
          if "GetAndroidApiLevel" not in header.read_text(encoding="utf-8"):
              raise SystemExit("ERRO: cabecalho de compatibilidade Android nao foi criado.")
          print("APIs Android corrigidas em memory_posix.cpp e threading_posix.cpp.")
          print(f"Cabecalho temporario criado: {header}")
          PYTHON

      - name: Verificar SDL3
        shell: bash
        run: |
          set -euo pipefail

          SDL_DIR="rexglue-sdk/thirdparty/sdl3"

          if [ ! -f "$SDL_DIR/CMakeLists.txt" ]; then
            echo "::error::SDL3 nao encontrado em $SDL_DIR"
            exit 1
          fi

          if [ ! -d "$SDL_DIR/include/SDL3" ]; then
            echo "::error::Cabecalhos SDL3 nao encontrados."
            exit 1
          fi

          # O ReXGlue força SDL_SHARED=OFF e SDL_STATIC=ON no arquivo
          # thirdparty/CMakeLists.txt. Isso produz SDL3 estático, mas
          # SDLActivity exige libSDL3.so. Ative SDL compartilhado somente
          # no build Android e preserve a configuração original em desktop.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("rexglue-sdk/thirdparty/CMakeLists.txt")
          content = path.read_text()

          old = '''set(SDL_SHARED OFF CACHE BOOL "" FORCE)
          set(SDL_STATIC ON CACHE BOOL "" FORCE)'''
          new = '''if(ANDROID)
              set(SDL_SHARED ON CACHE BOOL "" FORCE)
              set(SDL_STATIC OFF CACHE BOOL "" FORCE)
          else()
              set(SDL_SHARED OFF CACHE BOOL "" FORCE)
              set(SDL_STATIC ON CACHE BOOL "" FORCE)
          endif()'''

          if old not in content:
              if new in content:
                  print("SDL3 ja configurado como compartilhado no Android.")
              else:
                  raise SystemExit(
                      "ERRO: nao encontrei as definicoes SDL_SHARED/SDL_STATIC "
                      "esperadas em rexglue-sdk/thirdparty/CMakeLists.txt."
                  )
          else:
              path.write_text(content.replace(old, new, 1))
              print("SDL3 configurado como biblioteca compartilhada somente no Android.")

          check = path.read_text()
          if "if(ANDROID)" not in check or 'set(SDL_SHARED ON CACHE BOOL "" FORCE)' not in check:
              raise SystemExit("ERRO: a configuracao SDL3 compartilhada nao foi confirmada.")
          PY

          echo "SDL3 encontrado e configurado para gerar libSDL3.so no Android."
          git -C "$SDL_DIR" log -1 --oneline || true

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      - name: Verificar ferramentas instaladas
        shell: bash
        run: |
          set -euo pipefail

          java -version
          python --version
          gradle --version

          echo "ANDROID_HOME=${ANDROID_HOME:-nao definido}"
          sdkmanager --list_installed
          ls "$ANDROID_HOME/ndk"
          cmake --version

      - name: Verificar integracao nativa XISO
        shell: bash
        run: |
          set -euo pipefail

          CPP_DIR="android/app/src/main/cpp"
          CMAKE_FILE="$CPP_DIR/CMakeLists.txt"
          BRIDGE_FILE="$CPP_DIR/native-xiso-bridge.cpp"
          XISO_FILE="thirdparty/extract-xiso/extract-xiso.c"
          INTEGRATION_FILE="$CPP_DIR/xiso-integration.cmake"

          test -f "$CMAKE_FILE"
          test -f "$BRIDGE_FILE"
          test -f "$XISO_FILE"
          test -f "$INTEGRATION_FILE"

          echo "Referencias XISO no CMake:"
          grep -n -i "xiso" "$CMAKE_FILE" || true

          echo ""
          echo "Conteudo do arquivo de integracao:"
          cat "$INTEGRATION_FILE"

          if ! grep -qi "native-xiso-bridge.cpp" "$CMAKE_FILE" &&
             ! grep -qi "xiso-integration.cmake" "$CMAKE_FILE"; then
            echo "::error file=$CMAKE_FILE::O CMakeLists.txt nao referencia a ponte XISO nem o arquivo xiso-integration.cmake."
            exit 1
          fi

          echo "Arquivos XISO encontrados."

      - name: Inspecionar codigo gerado
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android-diagnostic

          python - <<'PYTHON'
          from pathlib import Path

          root = Path("generated")
          report = Path("android-diagnostic/generated-inspection.txt")
          lines = [
              "INSPECAO DO CODIGO GERADO",
              "=" * 60,
              "",
          ]

          if not root.is_dir():
              lines.append("AVISO: pasta generated/ nao encontrada.")
          else:
              extensions = {".cpp", ".cc", ".c", ".h", ".hpp", ".cmake"}
              files = sorted(
                  p for p in root.rglob("*")
                  if p.is_file() and p.suffix in extensions
              )

              lines.append(f"Arquivos C/C++/CMake encontrados: {len(files)}")
              lines.append("")

              for name in (
                  "blackops1_init.cpp",
                  "blackops1_register.cpp",
                  "sources.cmake",
                  "rexglue.cmake",
                  "blackops1_pch.h",
                  "blackops1_funcs.h",
              ):
                  path = root / name
                  status = "PRESENTE" if path.is_file() else "AUSENTE"
                  lines.append(f"{name}: {status}")

              lines.append("")
              lines.append("ARQUIVOS RECOMPILADOS:")

              recomp = sorted(root.glob("blackops1_recomp.*.cpp"))
              lines.append(f"Quantidade: {len(recomp)}")

              for path in recomp:
                  lines.append(f"  {path.as_posix()}")

              lines.append("")
              lines.append(
                  "A inspecao estatica nao comprova compatibilidade "
                  "do runtime com Android ARM64."
              )

          report.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )
          print(report.read_text(encoding="utf-8"))
          PYTHON

      - name: Diagnosticos segmentados antes da compilacao
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p android-diagnostic
          bash tools/android/diagnostico_build_segmentado.sh 2>&1 | tee android-diagnostic/diagnostico-build-segmentado.txt
          diagnostic_status=${PIPESTATUS[0]}
          if [ "$diagnostic_status" -ne 0 ]; then
            echo "::warning::O script de diagnóstico terminou com código $diagnostic_status; consulte os blocos COMEÇO/FIM ANÁLISE."
          fi

      - name: Integrar filesystem ContentResolver no ReXGlue Android
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="patches/android/filesystem_android.cpp"
          TARGET="rexglue-sdk/src/core/filesystem_android.cpp"
          CMAKE_FILE="rexglue-sdk/src/core/CMakeLists.txt"

          test -f "$SOURCE"
          test -f "$CMAKE_FILE"
          cp "$SOURCE" "$TARGET"

          python3 - "$CMAKE_FILE" <<'PYTHON'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")
          marker = """# Xenos data-format layer (stateless; headers under include/rex/graphics/)."""
          block = """# Android ContentResolver bridge for content:// file descriptors.
          if(ANDROID)
              target_sources(rexcore PRIVATE filesystem_android.cpp)
          endif()

          """
          if "target_sources(rexcore PRIVATE filesystem_android.cpp)" not in content:
              if marker not in content:
                  raise SystemExit("ERRO: ponto de insercao no CMakeLists.txt do rexcore nao encontrado.")
              content = content.replace(marker, block + marker, 1)
          if "target_link_libraries(rexcore PRIVATE SDL3::SDL3)" not in content:
              content = content.replace(
                  "target_sources(rexcore PRIVATE filesystem_android.cpp)",
                  "target_sources(rexcore PRIVATE filesystem_android.cpp)\n    target_link_libraries(rexcore PRIVATE SDL3::SDL3)",
                  1,
              )
          path.write_text(content, encoding="utf-8")

          verify = path.read_text(encoding="utf-8")
          if "target_sources(rexcore PRIVATE filesystem_android.cpp)" not in verify:
              raise SystemExit("ERRO: a integracao Android nao foi adicionada ao alvo rexcore.")
          if "target_link_libraries(rexcore PRIVATE SDL3::SDL3)" not in verify:
              raise SystemExit("ERRO: dependencias de cabecalho SDL3 nao foram adicionadas ao rexcore.")
          print("Filesystem Android integrado ao alvo rexcore com SDL3.")
          PYTHON

          grep -n -A4 -B2 'filesystem_android.cpp' "$CMAKE_FILE"
          grep -n -E 'AndroidInitialize|IsAndroidContentUri|OpenAndroidContentFileDescriptor' "$TARGET"

      - name: Verificar entrada SDL3 e contexto Android do runtime
        shell: bash
        run: |
          set -euo pipefail

          SDL_JAVA="rexglue-sdk/thirdparty/sdl3/android-project/app/src/main/java/org/libsdl/app/SDLActivity.java"
          RUNTIME_ENTRY="android/app/src/main/cpp/android_main.cpp"
          APP_CMAKE="android/app/src/main/cpp/CMakeLists.txt"
          APP_GRADLE="android/app/build.gradle"

          test -f "$SDL_JAVA" || {
            echo "::error::SDLActivity.java nao encontrado no mesmo checkout SDL3 usado pelo CMake."
            exit 1
          }
          test -f "$RUNTIME_ENTRY" || {
            echo "::error::Entrada Android SDL_main ausente."
            exit 1
          }
          grep -q 'android_main.cpp' "$APP_CMAKE"
          grep -q 'thirdparty/sdl3/android-project/app/src/main/java' "$APP_GRADLE"
          if grep -q 'SDL3-3.4.18.aar' "$APP_GRADLE"; then
            echo "::error::O AAR SDL3 separado ainda esta declarado e pode reintroduzir bibliotecas SDL conflitantes."
            exit 1
          fi

          grep -q 'SDL_main(int argc, char\* argv\[\])' "$RUNTIME_ENTRY"
          grep -q 'SetAndroidApplicationContext' "$RUNTIME_ENTRY"
          grep -q 'InitializeAndroidSystemForApplicationContext' "$RUNTIME_ENTRY"
          grep -q 'ShutdownAndroidSystem' "$RUNTIME_ENTRY"
          grep -q 'memory::AndroidInitialize' "$RUNTIME_ENTRY"
          grep -q 'thread::AndroidInitialize' "$RUNTIME_ENTRY"
          grep -q 'filesystem::AndroidInitialize' "$RUNTIME_ENTRY"
          grep -q 'WindowedApp::GetCreator("blackops1")' "$RUNTIME_ENTRY"
          grep -q 'openContentFd(String uriText, String mode)' android/app/src/main/java/com/blackops1/recomp/GameActivity.java
          grep -q 'openContentFd' rexglue-sdk/src/core/android_runtime.cpp
          grep -q 'DEBUG_POSTFIX ""' "$APP_CMAKE"
          grep -q 'add_custom_target(blackops1_stage_gpu_plugin' "$APP_CMAKE"
          grep -q 'REX_PLATFORM_ANDROID=1' "$APP_CMAKE"
          grep -q 'XE_UI_WINDOWED_APPS_IN_LIBRARY=1' "$APP_CMAKE"

          echo "OK: SDLActivity Java e SDL nativo vem do mesmo checkout."
          echo "OK: ABI Android consistente e plugin Xenos staged em jniLibs."
          echo "OK: SDL_main fornece o contexto JNI, inicializa o sistema Android e seleciona blackops1."

      - name: Compilar APK ARM64
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --stacktrace assembleDebug

      # Publicar imediatamente apos a compilacao, antes das verificacoes.
      # Assim o APK fica disponivel mesmo se a validacao abaixo falhar.
      - name: Publicar APK ARM64 para diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlackOps1-Android-ARM64-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK nao encontrado em $APK"
            find android/app/build/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"
          file "$APK"

          echo "Verificando bibliotecas nativas dentro do APK..."
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*[.]so$' || true

          if ! unzip -l "$APK" | grep -qE 'lib/arm64-v8a/libSDL3[.]so$'; then
            echo "::error::libSDL3.so ausente do APK ARM64. SDLActivity nao pode iniciar."
            exit 1
          fi

          if ! unzip -l "$APK" | grep -qE 'lib/arm64-v8a/libblackops1_android[.]so$'; then
            echo "::error::libblackops1_android.so ausente do APK ARM64."
            exit 1
          fi

          if unzip -l "$APK" | grep -qE 'lib/arm64-v8a/libSDL3d[.]so$'; then
            echo "::error::libSDL3d.so ainda foi empacotada; SDLActivity precisa de libSDL3.so com SONAME correspondente."
            exit 1
          fi

          SDL_COUNT=$(unzip -l "$APK" | grep -cE 'lib/arm64-v8a/libSDL3[.]so$' || true)
          if [ "$SDL_COUNT" -ne 1 ]; then
            echo "::error::Esperava exatamente uma libSDL3.so no APK; encontrei $SDL_COUNT."
            exit 1
          fi

          # OnInitialize carrega o plugin pelo nome que o SDK deriva da
          # configuracao CMake. assembleDebug precisa levar o postfix 'd'.
          for library in librexruntimed.so librexgpu-xenosd.so libc++_shared.so; do
            if ! unzip -l "$APK" | grep -qE "lib/arm64-v8a/${library}$"; then
              echo "::error::Biblioteca obrigatoria ausente do APK ARM64: ${library}"
              exit 1
            fi
          done

          mkdir -p android-diagnostic
          unzip -p "$APK" lib/arm64-v8a/libblackops1_android.so > android-diagnostic/libblackops1_android.so
          readelf -d android-diagnostic/libblackops1_android.so > android-diagnostic/native-needed.txt
          cat android-diagnostic/native-needed.txt
          grep -q 'libSDL3[.]so' android-diagnostic/native-needed.txt || {
            echo "::error::libblackops1_android.so nao declara a dependencia libSDL3.so que SDLActivity carrega."
            exit 1
          }
          grep -q 'librexruntimed[.]so' android-diagnostic/native-needed.txt || {
            echo "::error::libblackops1_android.so nao declara a dependencia do runtime ReXGlue Debug."
            exit 1
          }
          if grep -q 'libSDL3d[.]so' android-diagnostic/native-needed.txt; then
            echo "::error::libblackops1_android.so ainda pede libSDL3d.so, que nao e carregada pelo SDLActivity."
            exit 1
          fi

          unzip -p "$APK" lib/arm64-v8a/librexruntimed.so > android-diagnostic/librexruntimed.so
          readelf -d android-diagnostic/librexruntimed.so > android-diagnostic/runtime-needed.txt
          grep -q 'libSDL3[.]so' android-diagnostic/runtime-needed.txt || {
            echo "::error::librexruntimed.so nao declara a dependencia libSDL3.so."
            exit 1
          }
          if grep -q 'libSDL3d[.]so' android-diagnostic/runtime-needed.txt; then
            echo "::error::librexruntimed.so ainda pede libSDL3d.so."
            exit 1
          fi

          unzip -p "$APK" lib/arm64-v8a/librexgpu-xenosd.so > android-diagnostic/librexgpu-xenosd.so
          readelf -d android-diagnostic/librexgpu-xenosd.so > android-diagnostic/plugin-needed.txt
          grep -q 'librexruntimed[.]so' android-diagnostic/plugin-needed.txt || {
            echo "::error::O plugin Xenos nao foi ligado ao mesmo runtime ReXGlue."
            exit 1
          }

          echo "OK: SDL3 tem SONAME consistente; runtime, STL e plugin Xenos Debug estao empacotados."

      - name: Auditar alinhamento ELF para paginas Android de 16 KiB
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/android/audit_apk_alignment.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Salvar diagnostico do ambiente
        if: always()
        shell: bash
        run: |
          mkdir -p android-diagnostic

          {
            echo "Diagnostico do ambiente Android"
            date -u
            java -version 2>&1 || true
            python --version 2>&1 || true
            gradle --version 2>&1 || true
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME/ndk" 2>&1 || true
            cmake --version 2>&1 || true

            echo "APKs encontrados:"
            find android/app/build/outputs \
              -type f -name "*.apk" -print 2>&1 || true

            echo "Arquivos XISO encontrados:"
            find thirdparty android/app/src/main/cpp \
              -maxdepth 5 -iname '*xiso*' -type f -print 2>&1 || true
          } > android-diagnostic/environment.txt

      - name: Publicar diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: android-diagnostic/
          if-no-files-found: warn
          retention-days: 7

