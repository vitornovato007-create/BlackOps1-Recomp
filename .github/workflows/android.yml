name: Android ARM64 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-android:
    name: Inspect and Build Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Diagnostico estatico unificado
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p android-diagnostic
          python3 tools/diagnostico_completo.py 2>&1 | tee android-diagnostic/diagnostico-completo.txt
          diagnostic_status=${PIPESTATUS[0]}
          if [ "$diagnostic_status" -ne 0 ]; then
            echo "::error::O diagnostico estatico encontrou bloqueadores."
            exit "$diagnostic_status"
          fi
          python3 scripts/auditar_gerados.py 2>&1 | tee android-diagnostic/auditoria-gerados.txt
          audit_status=${PIPESTATUS[0]}
          if [ "$audit_status" -ne 0 ]; then
            echo "::error::A auditoria de arquivos gerados falhou."
            exit "$audit_status"
          fi

      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          set -uo pipefail

          required_files=(
            "android/settings.gradle"
            "android/build.gradle"
            "android/gradle.properties"
            "android/app/build.gradle"
            "android/app/src/main/AndroidManifest.xml"
            "android/app/src/main/cpp/CMakeLists.txt"
            "android/app/src/main/cpp/native-lib.cpp"
            "android/app/src/main/cpp/native-xiso-bridge.cpp"
            "android/app/src/main/cpp/xiso-integration.cmake"
            "thirdparty/extract-xiso/extract-xiso.c"
          )

          missing=0

          echo "=========================================="
          echo "VERIFICACAO DA ESTRUTURA DO PROJETO"
          echo "=========================================="

          for path in "${required_files[@]}"; do
            if [ -f "$path" ]; then
              echo "[OK] $path"
            else
              echo "::error file=$path::Arquivo obrigatorio nao encontrado: $path"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Arquivos encontrados nas pastas relevantes:"
            find android/app/src/main/cpp thirdparty \
              -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "Estrutura inicial encontrada."

      - name: Preparar ReXGlue e submodulos
        shell: bash
        run: |
          set -euo pipefail

          REXGLUE_URL="https://github.com/rexglue/rexglue-sdk.git"

          if [ -f "rexglue-sdk/CMakeLists.txt" ] &&
             [ -f "rexglue-sdk/thirdparty/CMakeLists.txt" ] &&
             [ -f "rexglue-sdk/thirdparty/cli11/CMakeLists.txt" ] &&
             [ -f "rexglue-sdk/thirdparty/sdl3/CMakeLists.txt" ]; then
            echo "ReXGlue e componentes principais encontrados."
          else
            echo "Checkout existente incompleto."
            echo "Tentando obter ReXGlue com submodulos..."
            rm -rf rexglue-sdk
            git clone --recursive "$REXGLUE_URL" rexglue-sdk
          fi

          test -f "rexglue-sdk/CMakeLists.txt"
          test -f "rexglue-sdk/thirdparty/CMakeLists.txt"
          test -f "rexglue-sdk/thirdparty/cli11/CMakeLists.txt"
          test -f "rexglue-sdk/thirdparty/sdl3/CMakeLists.txt"

          echo "ReXGlue preparado."
          git -C rexglue-sdk log -1 --oneline
          git -C rexglue-sdk submodule status --recursive

      - name: Aplicar compatibilidade C++ do ReXGlue para Android NDK
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          numeric = Path("rexglue-sdk/include/rex/string/numeric.h")
          chrono = Path("rexglue-sdk/include/rex/chrono/chrono.h")

          for path in (numeric, chrono):
              if not path.is_file():
                  raise SystemExit(f"::error file={path}::Cabecalho ReXGlue ausente.")
          
          # The upstream SDK is freshly cloned on every workflow run, so apply
          # these compatibility changes here instead of relying on repo edits.
          text = numeric.read_text(encoding="utf-8")
          text, include_count = re.subn(
              r"(?m)^#if REX_PLATFORM_MAC\\s*$",
              "#if REX_PLATFORM_MAC || REX_PLATFORM_ANDROID || defined(ANDROID) || defined(__ANDROID__)",
              text,
          )
          if include_count < 3:
              raise SystemExit(
                  "ERRO: numeric.h mudou de formato; esperava ao menos 3 "
                  "guards de plataforma para float from_chars."
              )
          numeric.write_text(text, encoding="utf-8")

          text = chrono.read_text(encoding="utf-8")
          old_guard = "#ifdef __APPLE__"
          new_guard = "#if defined(__APPLE__) || defined(__ANDROID__) || defined(ANDROID)"
          if old_guard not in text:
              if new_guard not in text:
                  raise SystemExit(
                      "ERRO: chrono.h nao contem o guard Apple esperado; "
                      "nao foi aplicado fallback automaticamente."
                  )
          else:
              text = text.replace(old_guard, new_guard, 1)
              chrono.write_text(text, encoding="utf-8")

          # Verify the patch actually landed in the fresh checkout.
          numeric_text = numeric.read_text(encoding="utf-8")
          chrono_text = chrono.read_text(encoding="utf-8")
          if "portable_float_from_chars" not in numeric_text:
              raise SystemExit("ERRO: fallback de float nao encontrado em numeric.h.")
          if "defined(__ANDROID__)" not in numeric_text:
              raise SystemExit("ERRO: guard Android ausente em numeric.h.")
          if "defined(__ANDROID__)" not in chrono_text and "defined(ANDROID)" not in chrono_text:
              raise SystemExit("ERRO: fallback chrono nao foi habilitado para Android.")

          print("Compatibilidade Android aplicada e verificada:")
          print(f"  {numeric}: {include_count} guards ajustados")
          print(f"  {chrono}: fallback chrono habilitado para Android")
          PYTHON

          echo "Confirmando alteracoes aplicadas:"
          grep -n -E 'portable_float_from_chars|REX_PLATFORM_MAC.*ANDROID|defined\\(__ANDROID__\\)' \
            rexglue-sdk/include/rex/string/numeric.h
          grep -n -E 'defined\\(__ANDROID__\\)|defined\\(ANDROID\\)|clock_time_conversion' \
            rexglue-sdk/include/rex/chrono/chrono.h | head -20

      - name: Corrigir dependencias Linux no ReXGlue para Android
        shell: bash
        run: |
          set -euo pipefail

          FILE="rexglue-sdk/src/ui/CMakeLists.txt"

          if [ ! -f "$FILE" ]; then
            echo "::error file=$FILE::CMakeLists.txt do rexui nao encontrado."
            exit 1
          fi

          python - "$FILE" <<'PYTHON'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"(?m)^# Platform-specific dependencies[^\n]*\n"
              r".*?"
              r"(?=^if\(WIN32\)\s*$)",
              re.DOTALL,
          )

          replacement = """# Platform-specific dependencies.
          # Android must not require Linux desktop X11/Wayland packages.
          if(ANDROID)
              # SDL3 provides Android platform integration.
          elseif(UNIX AND NOT APPLE)
              find_package(PkgConfig REQUIRED)

              pkg_check_modules(X11_XCB REQUIRED x11-xcb)
              pkg_check_modules(WAYLAND REQUIRED wayland-client)

              target_include_directories(rexui PUBLIC
                  ${X11_XCB_INCLUDE_DIRS}
                  ${WAYLAND_INCLUDE_DIRS}
              )

              target_link_libraries(rexui PUBLIC
                  ${X11_XCB_LIBRARIES}
                  ${WAYLAND_LIBRARIES}
              )
          elseif(APPLE)
              target_link_libraries(rexui PRIVATE "-framework CoreFoundation")
          endif()

          """

          updated, count = pattern.subn(
              lambda _: replacement,
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "ERRO: nao foi possivel localizar a secao de "
                  "dependencias de plataforma esperada em "
                  "rexglue-sdk/src/ui/CMakeLists.txt. "
                  "O arquivo nao foi alterado."
              )

          path.write_text(updated, encoding="utf-8")

          result = path.read_text(encoding="utf-8")

          if "if(ANDROID)" not in result:
              raise SystemExit(
                  "ERRO: o bloco de dependencias Android nao foi aplicado."
              )

          print("Correcao Android aplicada ao ReXGlue.")
          print("Verificando bloco de dependencias:")
          print(
              result[
                  result.find("# Platform-specific dependencies"):
                  result.find("if(WIN32)", result.find(
                      "# Platform-specific dependencies"
                  ))
              ]
          )
          PYTHON

      - name: Verificar SDL3
        shell: bash
        run: |
          set -euo pipefail

          SDL_DIR="rexglue-sdk/thirdparty/sdl3"

          if [ ! -f "$SDL_DIR/CMakeLists.txt" ]; then
            echo "::error::SDL3 nao encontrado em $SDL_DIR"
            exit 1
          fi

          if [ ! -d "$SDL_DIR/include/SDL3" ]; then
            echo "::error::Cabecalhos SDL3 nao encontrados."
            exit 1
          fi

          echo "SDL3 encontrado."
          git -C "$SDL_DIR" log -1 --oneline || true

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      - name: Verificar ferramentas instaladas
        shell: bash
        run: |
          set -euo pipefail

          java -version
          python --version
          gradle --version

          echo "ANDROID_HOME=${ANDROID_HOME:-nao definido}"
          sdkmanager --list_installed
          ls "$ANDROID_HOME/ndk"
          cmake --version

      - name: Verificar integracao nativa XISO
        shell: bash
        run: |
          set -euo pipefail

          CPP_DIR="android/app/src/main/cpp"
          CMAKE_FILE="$CPP_DIR/CMakeLists.txt"
          BRIDGE_FILE="$CPP_DIR/native-xiso-bridge.cpp"
          XISO_FILE="thirdparty/extract-xiso/extract-xiso.c"
          INTEGRATION_FILE="$CPP_DIR/xiso-integration.cmake"

          test -f "$CMAKE_FILE"
          test -f "$BRIDGE_FILE"
          test -f "$XISO_FILE"
          test -f "$INTEGRATION_FILE"

          echo "Referencias XISO no CMake:"
          grep -n -i "xiso" "$CMAKE_FILE" || true

          echo ""
          echo "Conteudo do arquivo de integracao:"
          cat "$INTEGRATION_FILE"

          if ! grep -qi "native-xiso-bridge.cpp" "$CMAKE_FILE" &&
             ! grep -qi "xiso-integration.cmake" "$CMAKE_FILE"; then
            echo "::error file=$CMAKE_FILE::O CMakeLists.txt nao referencia a ponte XISO nem o arquivo xiso-integration.cmake."
            exit 1
          fi

          echo "Arquivos XISO encontrados."

      - name: Inspecionar codigo gerado
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android-diagnostic

          python - <<'PYTHON'
          from pathlib import Path

          root = Path("generated")
          report = Path("android-diagnostic/generated-inspection.txt")
          lines = [
              "INSPECAO DO CODIGO GERADO",
              "=" * 60,
              "",
          ]

          if not root.is_dir():
              lines.append("AVISO: pasta generated/ nao encontrada.")
          else:
              extensions = {".cpp", ".cc", ".c", ".h", ".hpp", ".cmake"}
              files = sorted(
                  p for p in root.rglob("*")
                  if p.is_file() and p.suffix in extensions
              )

              lines.append(f"Arquivos C/C++/CMake encontrados: {len(files)}")
              lines.append("")

              for name in (
                  "blackops1_init.cpp",
                  "blackops1_register.cpp",
                  "sources.cmake",
                  "rexglue.cmake",
                  "blackops1_pch.h",
                  "blackops1_funcs.h",
              ):
                  path = root / name
                  status = "PRESENTE" if path.is_file() else "AUSENTE"
                  lines.append(f"{name}: {status}")

              lines.append("")
              lines.append("ARQUIVOS RECOMPILADOS:")

              recomp = sorted(root.glob("blackops1_recomp.*.cpp"))
              lines.append(f"Quantidade: {len(recomp)}")

              for path in recomp:
                  lines.append(f"  {path.as_posix()}")

              lines.append("")
              lines.append(
                  "A inspecao estatica nao comprova compatibilidade "
                  "do runtime com Android ARM64."
              )

          report.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )
          print(report.read_text(encoding="utf-8"))
          PYTHON

      - name: Compilar APK ARM64
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --stacktrace assembleDebug

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK nao encontrado em $APK"
            find android/app/build/outputs \
              -type f -print 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"
          file "$APK"

      - name: Salvar diagnostico do ambiente
        if: always()
        shell: bash
        run: |
          mkdir -p android-diagnostic

          {
            echo "Diagnostico do ambiente Android"
            date -u
            java -version 2>&1 || true
            python --version 2>&1 || true
            gradle --version 2>&1 || true
            echo "ANDROID_HOME=${ANDROID_HOME:-nao definido}"
            ls "${ANDROID_HOME:-/nonexistent}/ndk" 2>&1 || true
            cmake --version 2>&1 || true

            echo "APKs encontrados:"
            find android/app/build/outputs \
              -type f -name "*.apk" -print 2>&1 || true

            echo "Arquivos XISO encontrados:"
            find thirdparty android/app/src/main/cpp \
              -maxdepth 5 -iname '*xiso*' -type f -print 2>&1 || true
          } > android-diagnostic/environment.txt

      - name: Publicar diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: android-diagnostic/
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar APK ARM64
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlackOps1-Android-ARM64-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
